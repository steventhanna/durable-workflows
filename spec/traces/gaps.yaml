# Gap tests (durable-workflows/tests/gaps.rs, run with --include-ignored) and the
# invariant each one violates. `durable-trace gen --expect-violation` reads this;
# trace-check.sh requires the final state of each matching trace to violate it.
# Keys are globs over the test name (or its last `::` segment). The first match wins.
g11_*: inv_G11_cancelReachesChildren
# N2 via application cancel (T-X3) and via operator pause (T-A2).
n2_*: inv_S13_topicConcurrency
